services:
  - type: web
    name: revbid-server
    env: node
    region: oregon
    buildCommand: bun run --cwd packages/shared build && bun run --cwd apps/server build
    startCommand: bun run --cwd apps/server start
    envVars:
      - key: PORT
        value: 5001
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

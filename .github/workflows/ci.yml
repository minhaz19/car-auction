name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # ── apps/web ──────────────────────────────────────────────────────────
      - name: Lint (web)
        working-directory: apps/web
        run: bun run lint

      - name: Typecheck (web)
        working-directory: apps/web
        run: bun run typecheck

      # ── apps/server ───────────────────────────────────────────────────────
      - name: Lint (server)
        working-directory: apps/server
        run: bun run lint

      - name: Typecheck (server)
        working-directory: apps/server
        run: bun run typecheck
